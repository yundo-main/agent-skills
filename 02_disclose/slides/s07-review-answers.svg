  <text x="200" y="417" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#516174" xml:space="preserve" style="white-space:pre">스킬이 100개로 늘면 어떤 비용이 커지나?</text>
