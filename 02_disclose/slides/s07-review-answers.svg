  <text x="200" y="240" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" fill="#122033" xml:space="preserve" style="white-space:pre">된다 — 대신 매 트리거마다 상세 체크리스트를 통째로 태운다 (L2 비만화)</text>
  <text x="200" y="277" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#516174" xml:space="preserve" style="white-space:pre">L3 리소스를 본문에 다 합쳐 버리면 안 되나?</text>
