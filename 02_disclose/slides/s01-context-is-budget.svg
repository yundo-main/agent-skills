  <text x="880" y="375" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#516174" xml:space="preserve" style="white-space:pre">참조 시에만</text>
  <text x="640" y="590" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1769aa" text-anchor="middle" xml:space="preserve" style="white-space:pre">컨텍스트는 정밀함의 자원이지 창고가 아니다</text>
  <text x="640" y="625" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#516174" text-anchor="middle" xml:space="preserve" style="white-space:pre">스킬이 수백 개여도 — L1만 항상, 나머지는 선택적으로</text>
