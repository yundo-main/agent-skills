  <text x="80" y="362" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" fill="#516174" xml:space="preserve" style="white-space:pre">긴 입력 중간부를 덜 봄 (lost in the middle)</text>
  <rect x="60" y="390" width="560" height="66" rx="12" fill="#ffffff" stroke="#c9d5e1" stroke-width="1.5"/>
