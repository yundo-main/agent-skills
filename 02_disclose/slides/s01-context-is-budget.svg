  <text x="80" y="282" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" fill="#516174" xml:space="preserve" style="white-space:pre">토큰당 비용 — 툴 호출마다 재전송돼 누적</text>
  <rect x="60" y="310" width="560" height="66" rx="12" fill="#ffffff" stroke="#c9d5e1" stroke-width="1.5"/>
